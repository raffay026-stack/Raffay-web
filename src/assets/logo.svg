<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="logoTitle" preserveAspectRatio="xMidYMid meet">
  <title id="logoTitle">FK Decore logo</title>
  <defs>
    <linearGradient id="goldGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>
  </defs>

  <!-- Transparent background so CSS theme shows through -->
  <rect width="120" height="120" fill="transparent" />

  <!-- Perfume flacon silhouette -->
  <g transform="translate(60,62)">
    <rect x="-22" y="-30" width="44" height="54" rx="9" fill="none" stroke="url(#goldGrad)" stroke-width="2.8" stroke-linejoin="round" />
    <rect x="-10" y="-44" width="20" height="14" rx="3.5" fill="url(#goldGrad)" stroke="none" />
    <circle cx="0" cy="28" r="20" fill="#241522" opacity="0.06" />
  </g>

  <!-- Crown accent above the cap (subtle, minimal) -->
  <g transform="translate(60,21)" fill="url(#goldGrad)">
    <path d="M-12 6 L-6 -6 L0 6 L6 -6 L12 6 L-12 6 Z" opacity="0.98" />
  </g>

  <!-- Scent swirl (delicate line) -->
  <path d="M78 44 C86 36 96 34 102 30" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.95" />
  <path d="M42 38 C34 30 26 28 20 24" fill="none" stroke="#F2E9E1" stroke-width="1.6" stroke-linecap="round" opacity="0.9" />

  <!-- Accessible label (keeps existing wording) -->
</svg>






